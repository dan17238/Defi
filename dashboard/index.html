<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEV Bot</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --bd: #30363d; --bd2: #484f58;
  --fg: #e6edf3; --fg2: #8b949e; --fg3: #484f58;
  --green: #3fb950; --red: #f85149; --yellow: #d29922; --blue: #58a6ff;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--fg); font-size: 13px; line-height: 1.5; }

/* Layout */
.shell { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 260px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--bd); display: flex; flex-direction: column; overflow-y: auto; }
.main { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* Sidebar */
.sb-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--bd); }
.sb-brand { font-family: var(--mono); font-size: 15px; font-weight: 700; }
.sb-status { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--fg2); }
.sb-dot { width: 7px; height: 7px; border-radius: 50%; }
.sb-dot.on { background: var(--green); } .sb-dot.off { background: var(--red); }

.sb-pnl { padding: 20px 16px; border-bottom: 1px solid var(--bd); }
.sb-pnl-label { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.sb-pnl-val { font-family: var(--mono); font-size: 28px; font-weight: 700; margin: 4px 0; }
.sb-pnl-sub { font-size: 11px; color: var(--fg2); }

.sb-section { padding: 12px 16px; border-bottom: 1px solid var(--bd); }
.sb-section-title { font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 8px; }
.sb-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 12px; }
.sb-row-k { color: var(--fg2); display: flex; align-items: center; gap: 6px; }
.sb-row-v { font-family: var(--mono); font-weight: 500; }

.sb-nav { padding: 12px 8px; margin-top: auto; border-top: 1px solid var(--bd); }
.sb-tab { display: block; width: 100%; text-align: left; padding: 8px 12px; border: none; background: none; color: var(--fg2); font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 6px; }
.sb-tab:hover { background: var(--bg3); color: var(--fg); }
.sb-tab.active { background: var(--bg3); color: var(--fg); font-weight: 600; }

/* Page titles */
.page-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.page-title-sub { font-size: 12px; font-weight: 400; color: var(--fg2); }

/* Page visibility */
.page { display: none; }
.page.active { display: block; }

/* Card */
.card { background: var(--bg2); border: 1px solid var(--bd); border-radius: 8px; margin-bottom: 16px; }
.card-head { padding: 12px 16px; border-bottom: 1px solid var(--bd); font-size: 12px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; }
.card-body { padding: 16px; }

/* Best opportunity */
.best-opp { padding: 16px; display: flex; align-items: center; gap: 20px; min-height: 70px; }
.best-pair { font-size: 15px; font-weight: 700; }
.best-spread { font-family: var(--mono); font-size: 32px; font-weight: 700; }
.best-spread-unit { font-size: 13px; color: var(--fg2); font-weight: 400; margin-left: 2px; }
.best-detail { font-size: 12px; color: var(--fg2); margin-top: 2px; }
.best-none { font-size: 13px; color: var(--fg3); }
.best-divider { width: 1px; height: 48px; background: var(--bd); flex-shrink: 0; }

/* Event stream */
.ev { padding: 6px 16px; font-size: 12px; display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--bg); }
.ev:hover { background: rgba(255,255,255,0.02); }
.ev-time { font-family: var(--mono); font-size: 11px; color: var(--fg3); flex-shrink: 0; width: 65px; }
.ev-type { font-size: 11px; font-weight: 600; flex-shrink: 0; width: 36px; text-align: center; border-radius: 3px; padding: 1px 4px; }
.ev-type.det { color: var(--fg2); background: var(--bg3); }
.ev-type.sim { color: var(--blue); background: rgba(88,166,255,0.1); }
.ev-type.sub { color: var(--yellow); background: rgba(210,153,34,0.1); }
.ev-type.ok { color: var(--green); background: rgba(63,185,80,0.1); }
.ev-type.rev { color: var(--red); background: rgba(248,81,73,0.1); }
.ev-type.skip { color: var(--fg3); background: var(--bg); }
.ev-msg { flex: 1; color: var(--fg2); }
.ev-val { font-family: var(--mono); font-weight: 500; }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th { font-size: 11px; font-weight: 600; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.04em; text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--bd); background: var(--bg2); }
td { font-size: 12px; padding: 8px 16px; border-bottom: 1px solid var(--bg); }
tr:hover td { background: rgba(255,255,255,0.02); }
.empty-cell { text-align: center; padding: 32px; color: var(--fg3); }
.pos { color: var(--green); font-family: var(--mono); font-weight: 600; }
.neg { color: var(--red); font-family: var(--mono); font-weight: 600; }
a.tx-link { font-family: var(--mono); font-size: 11px; color: var(--blue); text-decoration: none; }
a.tx-link:hover { text-decoration: underline; }
.status-ok { color: var(--green); } .status-rev { color: var(--red); }

/* Pool list */
.pool-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--bg); gap: 12px; }
.pool-row:hover { background: rgba(255,255,255,0.02); }
.pool-name { flex: 1; font-weight: 500; font-size: 13px; }
.pool-spread { font-family: var(--mono); font-size: 14px; font-weight: 600; width: 80px; text-align: right; }
.pool-threshold { font-size: 11px; color: var(--fg3); width: 70px; text-align: right; }
.pool-bar-wrap { width: 120px; }
.pool-bar { height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
.pool-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.pool-profitable .pool-bar-fill { background: var(--green); }
.pool-waiting .pool-bar-fill { background: var(--fg3); }
.pool-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
.pool-tag.active { color: var(--green); background: rgba(63,185,80,0.1); }
.pool-tag.idle { color: var(--fg3); background: var(--bg3); }
.pool-item { border-bottom: 1px solid var(--bg); }
.pool-item:hover { background: rgba(255,255,255,0.02); }
.pool-detail { padding: 0 16px 8px; font-size: 11px; color: var(--fg3); font-family: var(--mono); display: flex; gap: 4px; flex-wrap: wrap; }

/* PnL chart (canvas) */
.chart-wrap { position: relative; height: 200px; }
.chart-wrap canvas { width: 100%; height: 100%; }
.chart-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--fg3); font-size: 13px; }

/* Time buttons */
.time-btns { display: flex; gap: 2px; }
.time-btn { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--bd); background: none; color: var(--fg3); cursor: pointer; font-family: var(--sans); }
.time-btn.active { background: var(--bg3); color: var(--fg); border-color: var(--bd2); }

/* Responsive */
@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; max-height: 50vh; flex-direction: row; flex-wrap: wrap; }
  .sb-nav { margin-top: 0; border-top: none; }
  .main { padding: 16px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--fg3); border-radius: 3px; }
</style>
</head>
<body>
<div class="shell">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sb-header">
    <div class="sb-brand">MEV Bot</div>
    <div class="sb-status">
      <span class="sb-dot on" id="statusDot"></span>
      <span id="statusText">连接中...</span>
      <span id="uptimeText" style="margin-left:auto"></span>
    </div>
  </div>

  <div class="sb-pnl">
    <div class="sb-pnl-label">累计 PnL</div>
    <div class="sb-pnl-val" id="totalPnl" style="color:var(--fg3)">$0.00</div>
    <div class="sb-pnl-sub" id="todayPnl">今日 $0.00</div>
  </div>

  <div class="sb-section">
    <div class="sb-section-title">连接</div>
    <div class="sb-row"><span class="sb-row-k"><span class="sb-dot on" id="nodeDot"></span>Node</span><span class="sb-row-v" id="nodeLatency">--</span></div>
    <div class="sb-row"><span class="sb-row-k"><span class="sb-dot on" id="feedDot"></span>Feed</span><span class="sb-row-v" id="feedStatus">--</span></div>
    <div class="sb-row"><span class="sb-row-k"><span class="sb-dot on" id="seqDot"></span>Sequencer</span><span class="sb-row-v" id="seqLatency">--</span></div>
  </div>

  <div class="sb-section">
    <div class="sb-section-title">套利统计</div>
    <div class="sb-row"><span class="sb-row-k">Scans</span><span class="sb-row-v" id="scanCount">0</span></div>
    <div class="sb-row"><span class="sb-row-k">机会</span><span class="sb-row-v" id="oppCount">0</span></div>
    <div class="sb-row"><span class="sb-row-k">交易</span><span class="sb-row-v" id="txCount">0</span></div>
    <div class="sb-row"><span class="sb-row-k">成功</span><span class="sb-row-v" id="successCount">0</span></div>
    <div class="sb-row"><span class="sb-row-k">Revert</span><span class="sb-row-v" id="revertCount">0</span></div>
    <div class="sb-row"><span class="sb-row-k">Gas 消耗</span><span class="sb-row-v" id="gasSpent">$0.00</span></div>
  </div>

  <div class="sb-section">
    <div class="sb-section-title">清算监控</div>
    <div class="sb-row"><span class="sb-row-k">AAVE V3</span><span class="sb-row-v" id="aaveBorrowers">--</span></div>
    <div class="sb-row"><span class="sb-row-k">Radiant</span><span class="sb-row-v" id="radiantBorrowers">--</span></div>
    <div class="sb-row"><span class="sb-row-k">清算次数</span><span class="sb-row-v" id="liqCount">0</span></div>
  </div>

  <nav class="sb-nav">
    <button class="sb-tab active" data-page="overview">Overview</button>
    <button class="sb-tab" data-page="trades">Trades</button>
    <button class="sb-tab" data-page="pools">Pools</button>
  </nav>
</aside>

<!-- Main content -->
<div class="main">

  <!-- Overview Page -->
  <div class="page active" id="page-overview">
    <div class="page-title">Overview <span class="page-title-sub" id="lastUpdate">更新中...</span></div>

    <!-- Best Opportunity -->
    <div class="card">
      <div class="card-head">当前最佳机会</div>
      <div class="best-opp" id="bestOpp">
        <div class="best-none">当前无可执行机会</div>
      </div>
    </div>

    <!-- Event Stream -->
    <div class="card">
      <div class="card-head">
        <span>最近事件</span>
        <span style="font-weight:400;text-transform:none;letter-spacing:0" id="eventCount">0 条</span>
      </div>
      <div id="eventList" style="max-height:400px;overflow-y:auto">
        <div class="empty-cell">等待事件...</div>
      </div>
    </div>

    <!-- PnL Chart -->
    <div class="card">
      <div class="card-head">
        <span>PnL 曲线</span>
        <div class="time-btns">
          <button class="time-btn active" onclick="setPnlRange('1h',this)">1H</button>
          <button class="time-btn" onclick="setPnlRange('24h',this)">24H</button>
          <button class="time-btn" onclick="setPnlRange('all',this)">All</button>
        </div>
      </div>
      <div class="card-body">
        <div class="chart-wrap">
          <canvas id="pnlCanvas"></canvas>
          <div class="chart-empty" id="pnlEmpty">暂无交易数据</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Trades Page -->
  <div class="page" id="page-trades">
    <div class="page-title">交易记录 <span class="page-title-sub" id="tradesSummary">共 0 笔</span></div>
    <div class="card">
      <table>
        <thead><tr>
          <th>时间</th><th>Pair</th><th>利润</th><th>Gas</th><th>状态</th><th>TX</th>
        </tr></thead>
        <tbody id="tradesBody">
          <tr><td colspan="6" class="empty-cell">暂无交易记录</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pools Page -->
  <div class="page" id="page-pools">
    <div class="page-title">池子监控 <span class="page-title-sub" id="poolsSummary">0 个池对</span></div>
    <div class="card">
      <div class="card-head">
        <span>实时价差</span>
        <span style="font-weight:400;text-transform:none;letter-spacing:0" id="poolsRefresh">--</span>
      </div>
      <div id="poolsList">
        <div class="empty-cell">等待数据...</div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
// ── State ──
let arbData = null, metricsData = null;
let pnlHistory = []; // [{ts, profit_usd}]
let pnlRange = '1h';
let apiLatencyMs = 0;

// ── Tab navigation ──
document.querySelectorAll('.sb-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sb-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
  });
});

// ── Data fetching ──
async function fetchData() {
  try {
    const t0 = performance.now();
    const [arbRes, metRes] = await Promise.all([
      fetch('/api/arb').then(r => r.json()),
      fetch('/api/metrics').then(r => r.json()),
    ]);
    apiLatencyMs = Math.round(performance.now() - t0);
    arbData = arbRes;
    metricsData = metRes;
    updateSidebar();
    updateOverview();
    updateTrades();
    updatePools();
    document.getElementById('statusDot').className = 'sb-dot on';
    document.getElementById('statusText').textContent = 'Running';
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('statusDot').className = 'sb-dot off';
    document.getElementById('statusText').textContent = '连接失败';
  }
}

// ── Sidebar updates ──
function updateSidebar() {
  const m = metricsData, a = arbData;
  // Uptime
  document.getElementById('uptimeText').textContent = m.uptime || '';
  // PnL
  const totalProfit = (m.arb_profit_usd || 0) + (m.total_profit_usd || 0);
  const pnlEl = document.getElementById('totalPnl');
  pnlEl.textContent = (totalProfit >= 0 ? '+' : '') + '$' + totalProfit.toFixed(2);
  pnlEl.style.color = totalProfit > 0 ? 'var(--green)' : totalProfit < 0 ? 'var(--red)' : 'var(--fg3)';
  // Stats
  setText('scanCount', fmtNum(a.scans || 0));
  setText('oppCount', fmtNum(a.opportunities || 0));
  setText('txCount', m.arb_attempts || 0);
  setText('successCount', m.arb_successes || 0);
  setText('revertCount', a.revert_count || 0);
  setText('gasSpent', '$' + (a.revert_gas_cost_usd || 0).toFixed(2));
  // Liquidation
  setText('liqCount', m.total_liquidations || 0);
  setText('aaveBorrowers', (m.positions_scanned || 0) + ' 仓位');
  // Connection
  setText('nodeLatency', apiLatencyMs + 'ms');
  const nodeDot = document.getElementById('nodeDot');
  nodeDot.className = 'sb-dot ' + (apiLatencyMs < 500 ? 'on' : 'off');

  const avgLat = m.avg_latency_ms;
  setText('seqLatency', avgLat > 0 ? avgLat.toFixed(0) + 'ms' : '待发送');
  const seqDot = document.getElementById('seqDot');
  seqDot.className = 'sb-dot ' + (avgLat > 0 ? 'on' : 'on');

  const feedOk = a.scans > 0;
  setText('feedStatus', feedOk ? '正常' : '等待');
  document.getElementById('feedDot').className = 'sb-dot ' + (feedOk ? 'on' : 'off');
}

// ── Overview page ──
function updateOverview() {
  updateBestOpp();
  updateEventList();
  updatePnlChart();
}

function updateBestOpp() {
  const pairs = arbData.pairs || [];
  if (pairs.length === 0) {
    document.getElementById('bestOpp').innerHTML = '<div class="best-none">等待池子数据...</div>';
    return;
  }

  // Find best pair (profitable first, then highest spread)
  const sorted = [...pairs].sort((a,b) => {
    if (a.profitable !== b.profitable) return a.profitable ? -1 : 1;
    return b.spread_bps - a.spread_bps;
  });
  const best = sorted[0];
  const ratio = Math.min(best.spread_bps / Math.max(best.fee_threshold_bps, 0.1) * 100, 200);
  const isProfitable = best.profitable;
  const el = document.getElementById('bestOpp');

  const statusHtml = isProfitable
    ? '<span style="color:var(--green);font-weight:600">可执行</span>'
    : `<span style="color:var(--fg3)">距阈值 ${(best.fee_threshold_bps - best.spread_bps).toFixed(1)} bps</span>`;

  el.innerHTML = `
    <div style="flex:1">
      <div class="best-pair">${esc(best.name)}</div>
      <div class="best-detail">${statusHtml}</div>
    </div>
    <div class="best-divider"></div>
    <div style="text-align:right">
      <div class="best-spread" style="color:${isProfitable ? 'var(--green)' : 'var(--fg)'}">${best.spread_bps.toFixed(1)}<span class="best-spread-unit">bps</span></div>
      <div class="best-detail">/ ${best.fee_threshold_bps.toFixed(1)} bps · ${ratio.toFixed(0)}%</div>
    </div>`;
}

function updateEventList() {
  const events = (arbData.events || []).slice(0, 30);
  const el = document.getElementById('eventList');
  document.getElementById('eventCount').textContent = events.length + ' 条';
  if (events.length === 0) {
    const scans = fmtNum(arbData.scans || 0);
    const pairs = (arbData.pairs || []).length;
    el.innerHTML = `<div class="empty-cell" style="padding:24px;line-height:2">
      正在扫描中 · ${scans} 次扫描 · ${pairs} 个池对监控<br>
      <span style="font-size:11px">检测到可执行机会时事件将显示在此</span>
    </div>`;
    return;
  }

  const kindMap = {
    detected: {cls:'det', label:'检测'},
    simulated: {cls:'sim', label:'模拟'},
    submitted: {cls:'sub', label:'发送'},
    confirmed: {cls:'ok', label:'确认'},
    reverted:  {cls:'rev', label:'回滚'},
    skipped:   {cls:'skip', label:'跳过'},
  };

  el.innerHTML = events.map(ev => {
    const k = kindMap[ev.kind] || {cls:'det', label: ev.kind};
    const time = new Date(ev.ts).toLocaleTimeString();
    let msg = esc(ev.pair);
    if (ev.spread_bps > 0) msg += ` ${ev.spread_bps.toFixed(1)} bps`;
    if (ev.profit_usd && ev.kind !== 'detected') msg += ` $${ev.profit_usd.toFixed(3)}`;
    if (ev.gas_used > 0) msg += ` gas ${fmtNum(ev.gas_used)}`;
    if (ev.tx_hash) msg += ` <a class="tx-link" href="https://arbiscan.io/tx/${ev.tx_hash}" target="_blank">${ev.tx_hash.slice(0,8)}...</a>`;
    if (ev.latency_ms > 0) msg += ` ${ev.latency_ms}ms`;
    return `<div class="ev"><span class="ev-time">${time}</span><span class="ev-type ${k.cls}">${k.label}</span><span class="ev-msg">${msg}</span></div>`;
  }).join('');
}

// ── PnL chart (canvas) ──
function updatePnlChart() {
  // Collect confirmed events as PnL points
  const confirmed = (arbData.events || []).filter(e => e.kind === 'confirmed' || e.kind === 'reverted');
  if (confirmed.length > 0) {
    confirmed.reverse().forEach(ev => {
      const p = ev.kind === 'confirmed' ? ev.profit_usd : -(ev.gas_cost_usd || 0);
      if (!pnlHistory.find(h => h.ts === ev.ts)) {
        pnlHistory.push({ts: ev.ts, profit_usd: p});
      }
    });
    pnlHistory.sort((a,b) => a.ts - b.ts);
  }

  const canvas = document.getElementById('pnlCanvas');
  const emptyEl = document.getElementById('pnlEmpty');
  if (pnlHistory.length < 2) { emptyEl.style.display = 'flex'; return; }
  emptyEl.style.display = 'none';

  const now = Date.now();
  let filtered = pnlHistory;
  if (pnlRange === '1h') filtered = pnlHistory.filter(p => now - p.ts < 3600000);
  else if (pnlRange === '24h') filtered = pnlHistory.filter(p => now - p.ts < 86400000);
  if (filtered.length < 2) { emptyEl.style.display = 'flex'; return; }

  // Cumulative
  let cum = 0;
  const points = filtered.map(p => { cum += p.profit_usd; return {ts: p.ts, v: cum}; });

  const ctx = canvas.getContext('2d');
  const W = canvas.parentElement.clientWidth;
  const H = canvas.parentElement.clientHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, W, H);

  const pad = {t:10, r:10, b:20, l:50};
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const minV = Math.min(0, ...points.map(p=>p.v));
  const maxV = Math.max(0, ...points.map(p=>p.v));
  const rangeV = maxV - minV || 1;
  const minT = points[0].ts, maxT = points[points.length-1].ts;
  const rangeT = maxT - minT || 1;

  function x(t) { return pad.l + (t - minT) / rangeT * cw; }
  function y(v) { return pad.t + (1 - (v - minV) / rangeV) * ch; }

  // Zero line
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, y(0)); ctx.lineTo(W-pad.r, y(0)); ctx.stroke();

  // Line
  ctx.strokeStyle = cum >= 0 ? '#3fb950' : '#f85149';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  points.forEach((p,i) => { i === 0 ? ctx.moveTo(x(p.ts), y(p.v)) : ctx.lineTo(x(p.ts), y(p.v)); });
  ctx.stroke();

  // Y axis labels
  ctx.fillStyle = '#484f58';
  ctx.font = '10px JetBrains Mono';
  ctx.textAlign = 'right';
  ctx.fillText('$' + maxV.toFixed(2), pad.l - 4, pad.t + 10);
  ctx.fillText('$' + minV.toFixed(2), pad.l - 4, H - pad.b);
  ctx.fillText('$0', pad.l - 4, y(0) + 3);
}

function setPnlRange(range, btn) {
  pnlRange = range;
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePnlChart();
}

// ── Trades page ──
function updateTrades() {
  const events = (arbData.events || []).filter(e => e.kind === 'submitted' || e.kind === 'confirmed' || e.kind === 'reverted');
  const tbody = document.getElementById('tradesBody');
  let totalProfit = 0, count = 0;

  if (events.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-cell">暂无交易记录</td></tr>';
    document.getElementById('tradesSummary').textContent = '共 0 笔';
    return;
  }

  // Group by tx_hash
  const txMap = new Map();
  events.forEach(ev => {
    if (!ev.tx_hash) return;
    const key = ev.tx_hash;
    if (!txMap.has(key) || ev.kind === 'confirmed' || ev.kind === 'reverted') {
      txMap.set(key, ev);
    }
  });

  const trades = [...txMap.values()].sort((a,b) => b.ts - a.ts);
  count = trades.length;
  trades.forEach(t => { if (t.kind === 'confirmed') totalProfit += t.profit_usd; else if (t.kind === 'reverted') totalProfit -= (t.gas_cost_usd||0); });

  document.getElementById('tradesSummary').textContent = `共 ${count} 笔  总 ${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}`;

  tbody.innerHTML = trades.map(t => {
    const time = new Date(t.ts).toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
    const isOk = t.kind === 'confirmed';
    const profit = isOk ? t.profit_usd : -(t.gas_cost_usd||0);
    const profitClass = profit >= 0 ? 'pos' : 'neg';
    const status = isOk ? '<span class="status-ok">✓ 确认</span>' : t.kind === 'reverted' ? '<span class="status-rev">✗ 回滚</span>' : '<span style="color:var(--yellow)">⏳ 等待</span>';
    const txShort = t.tx_hash ? t.tx_hash.slice(0,10) + '..' : '--';
    const txLink = t.tx_hash ? `<a class="tx-link" href="https://arbiscan.io/tx/${t.tx_hash}" target="_blank">${txShort}</a>` : '--';
    const gasStr = t.gas_used > 0 ? `$${(t.gas_cost_usd||0).toFixed(3)}<br><span style="color:var(--fg3)">${fmtNum(t.gas_used)}</span>` : '--';
    return `<tr>
      <td style="font-family:var(--mono);font-size:11px;white-space:nowrap">${time}</td>
      <td style="font-weight:500">${esc(t.pair)}</td>
      <td class="${profitClass}">${profit >= 0 ? '+' : ''}$${profit.toFixed(3)}</td>
      <td style="font-family:var(--mono);font-size:11px">${gasStr}</td>
      <td>${status}</td>
      <td>${txLink}</td>
    </tr>`;
  }).join('');
}

// ── Pools page ──
function updatePools() {
  const pairs = arbData.pairs || [];
  document.getElementById('poolsSummary').textContent = pairs.length + ' 个池对';
  const el = document.getElementById('poolsList');
  if (pairs.length === 0) { el.innerHTML = '<div class="empty-cell">等待数据...</div>'; return; }

  // Sort: profitable first, then by spread desc
  const sorted = [...pairs].sort((a,b) => {
    if (a.profitable !== b.profitable) return a.profitable ? -1 : 1;
    return b.spread_bps - a.spread_bps;
  });

  document.getElementById('poolsRefresh').textContent = new Date().toLocaleTimeString();

  el.innerHTML = sorted.map(p => {
    const ratio = Math.min(p.spread_bps / Math.max(p.fee_threshold_bps, 0.1) * 100, 200);
    const cls = p.profitable ? 'pool-profitable' : 'pool-waiting';
    const tag = p.profitable ? '<span class="pool-tag active">有利可图</span>' : '<span class="pool-tag idle">等待</span>';
    const spreadColor = p.profitable ? 'var(--green)' : 'var(--fg2)';

    // Second line: pool details
    let detail = '';
    if (p.kind === 'pair' && p.price_a > 0) {
      detail = `<span>${fmtPoolAddr(p.pool_a)}</span> <span style="color:var(--fg3)">↔</span> <span>${fmtPoolAddr(p.pool_b)}</span>`;
      detail += `<span style="margin-left:12px">价格 ${fmtPrice(p.price_a)} / ${fmtPrice(p.price_b)}</span>`;
    } else if (p.kind === 'route') {
      detail = `<span>${esc(p.path)}</span>`;
    } else {
      detail = `<span>${fmtPoolAddr(p.pool_a)}</span> <span style="color:var(--fg3)">↔</span> <span>${fmtPoolAddr(p.pool_b)}</span>`;
    }

    return `<div class="pool-item ${cls}">
      <div class="pool-row">
        <div class="pool-name">${esc(p.name)}</div>
        <div class="pool-bar-wrap"><div class="pool-bar"><div class="pool-bar-fill" style="width:${Math.min(ratio,100)}%"></div></div></div>
        <div class="pool-spread" style="color:${spreadColor}">${p.spread_bps.toFixed(1)} <span style="font-size:10px;color:var(--fg3)">bps</span></div>
        <div class="pool-threshold">/ ${p.fee_threshold_bps.toFixed(1)}</div>
        ${tag}
      </div>
      <div class="pool-detail">${detail}</div>
    </div>`;
  }).join('');
}

function fmtPoolAddr(addr) {
  if (!addr || addr.length < 10) return addr || '--';
  return addr.slice(0,6) + '..' + addr.slice(-4);
}

function fmtPrice(price) {
  if (price === 0) return '--';
  if (price >= 1000) return price.toFixed(2);
  if (price >= 1) return price.toFixed(4);
  return price.toFixed(6);
}

// ── Helpers ──
function setText(id, val) { document.getElementById(id).textContent = val; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtNum(n) { return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n); }

// ── Init ──
fetchData();
setInterval(fetchData, 2000);
</script>
